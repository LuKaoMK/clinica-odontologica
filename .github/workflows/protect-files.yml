name: Protect critical files
on:
  pull_request:

permissions:
  contents: read

jobs:
  protect-critical-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar arquivos protegidos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "LuKaoMK" ]; then
            echo "Autor é o dono, liberado."; exit 0
          fi
          PROTECTED='^(\.github/|CODEOWNERS|LICENSE|package-lock\.json)'
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E "$PROTECTED"; then
            echo "::error::Este PR altera arquivos protegidos."
            exit 1
          fi
